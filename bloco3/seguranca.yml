name: CI Security Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_IMAGE: saci-task-api:ci
  TRIVY_IMAGE: aquasec/trivy:0.76.2
  GITLEAKS_IMAGE: ghcr.io/gitleaks/gitleaks:v8.30.1

jobs:
  build:
    name: Install dependencies and build
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix app

      - name: Build Docker image and check application health
        run: |
          docker build --tag "$APP_IMAGE" ./app
          container_id=$(docker run -d -p 127.0.0.1:3000:3000 "$APP_IMAGE")
          trap 'docker rm -f "$container_id" >/dev/null' EXIT
          if ! curl --fail --silent --show-error --retry 15 --retry-all-errors \
            --retry-delay 1 --max-time 3 http://127.0.0.1:3000/health; then
            docker logs "$container_id"
            exit 1
          fi

  semgrep:
    name: Semgrep SAST gate
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep:1.187.0
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Scan application and fail on ERROR findings
        run: semgrep scan --config p/security-audit --severity ERROR --error app

  trivy-dependencies:
    name: Trivy dependency gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Scan dependency lockfile for critical vulnerabilities
        run: |
          docker run --rm --mount "type=bind,source=$PWD/app,target=/source,readonly" \
            "$TRIVY_IMAGE" fs --scanners vuln --severity CRITICAL --exit-code 1 /source

  trivy-image:
    name: Trivy container gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build image for scanning
        run: docker build --tag "$APP_IMAGE" ./app

      - name: Scan operating system and application packages
        run: |
          docker save "$APP_IMAGE" -o "$RUNNER_TEMP/saci-image.tar"
          docker run --rm --mount "type=bind,source=$RUNNER_TEMP/saci-image.tar,target=/image.tar,readonly" \
            "$TRIVY_IMAGE" image --input /image.tar --scanners vuln --severity CRITICAL --exit-code 1

  gitleaks:
    name: Gitleaks secrets gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository and full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan current files
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/repo,readonly" --workdir /repo \
            "$GITLEAKS_IMAGE" dir --redact=100 --exit-code 1 /repo

      - name: Scan Git history
        if: ${{ !cancelled() }}
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            --mount "type=bind,source=$PWD,target=/repo,readonly" --workdir /repo \
            "$GITLEAKS_IMAGE" git --redact=100 --exit-code 1 --log-opts="--all" /repo

  render-deploy:
    name: Render deploy gate
    needs: [build, semgrep, trivy-dependencies, trivy-image, gitleaks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Release commit to Render after successful checks
        run: echo 'Aprovado para deploy. O Render monitora os checks deste commit via checksPass.' >> "$GITHUB_STEP_SUMMARY"
