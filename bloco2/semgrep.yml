name: CI Security Gate

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Install dependencies and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix app

      - name: Build Docker image
        run: docker build --tag saci-task-api:ci ./app

  semgrep:
    name: Semgrep SAST gate
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Scan application and fail on ERROR findings
        run: semgrep scan --config p/security-audit --severity ERROR --error app
